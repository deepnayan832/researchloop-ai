<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14243b" />
    <meta name="description" content="ResearchLoop AI — evidence-first research for Indian listed companies." />
    <title>ResearchLoop AI — Research workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#overview" data-view="overview" aria-label="ResearchLoop AI home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 24" fill="none"><path d="M16 4.5H12a7.5 7.5 0 0 0 0 15h4.2c2.2 0 4.1-.95 5.55-2.65L28 9.2A7.5 7.5 0 0 1 34 6.5h-4.2c-2.2 0-4.1.95-5.55 2.65L18 16.8a7.5 7.5 0 0 1-6 2.7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 19.5h4a7.5 7.5 0 0 0 0-15h-4.2c-2.2 0-4.1.95-5.55 2.65L12 14.8a7.5 7.5 0 0 1-6 2.7" stroke="#8ce0c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="brand-name">ResearchLoop <span>AI</span></span>
        </a>

        <div class="sidebar-label">WORKSPACE</div>
        <nav class="primary-nav">
          <button class="nav-item is-active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V10Z"/><path d="M9 20.5v-7h6v7"/></svg><span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-view="runs">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h8l4 4v13H5v-17h2Z"/><path d="M14.5 3.5v4h4M8.5 12h7M8.5 16h7"/></svg><span>Research runs</span><span class="nav-count" id="run-count">0</span>
          </button>
          <button class="nav-item" type="button" data-view="watchlist">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.75 5.58 6.16.9-4.46 4.35 1.05 6.14L12 17.07l-5.5 2.9 1.05-6.14L3.1 9.48l6.16-.9L12 3Z"/></svg><span>Watchlist</span>
          </button>
          <button class="nav-item" type="button" data-view="reports">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V13M10 19.5V8M16 19.5V4M22 19.5V10"/></svg><span>Reports</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <button class="nav-item" type="button" data-view="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.3 1-1.3 2.3-1.6-.6a8.4 8.4 0 0 1-1.7 1l-.3 1.7h-2.7l-.3-1.7a8.4 8.4 0 0 1-1.7-1l-1.6.6-1.3-2.3 1.3-1a7.7 7.7 0 0 1 0-2l-1.3-1L7.6 9.7l1.6.6a8.4 8.4 0 0 1 1.7-1l.3-1.7h2.7l.3 1.7a8.4 8.4 0 0 1 1.7 1l1.6-.6 1.3 2.3-1.3 1a7.7 7.7 0 0 1-.1 2Z" transform="translate(-1 -1)"/></svg><span>Settings</span>
          </button>
          <div class="sidebar-user">
            <div class="avatar">RL</div>
            <div class="user-copy"><strong>Research workspace</strong><span>SQLite · local server</span></div>
            <span class="demo-dot" title="Local server workspace"></span>
          </div>
        </div>
      </aside>

      <div class="mobile-backdrop" id="mobile-backdrop"></div>
      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <a class="mobile-brand" href="#overview" data-view="overview" aria-label="ResearchLoop AI home">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 24" fill="none"><path d="M16 4.5H12a7.5 7.5 0 0 0 0 15h4.2c2.2 0 4.1-.95 5.55-2.65L28 9.2A7.5 7.5 0 0 1 34 6.5h-4.2c-2.2 0-4.1.95-5.55 2.65L18 16.8a7.5 7.5 0 0 1-6 2.7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 19.5h4a7.5 7.5 0 0 0 0-15h-4.2c-2.2 0-4.1.95-5.55 2.65L12 14.8a7.5 7.5 0 0 1-6 2.7" stroke="#8ce0c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="brand-name">ResearchLoop <span>AI</span></span>
          </a>
          <div class="topbar-title" id="topbar-title">Research workspace</div>
          <div class="topbar-actions">
            <span class="demo-badge"><span></span> Local backend</span>
            <button class="workspace-button" type="button" aria-label="Current workspace">
              <span class="avatar avatar-small">RL</span><span>Research workspace</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
          </div>
        </header>
        <div class="content" id="app-content" tabindex="-1"></div>
        <footer class="app-footer"><span>ResearchLoop AI</span><span>Server-saved runs · live providers may be unavailable</span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
