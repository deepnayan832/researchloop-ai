name: Security hardening CI

on:
  push:
    branches:
      - main
      - "security/**"
      - "deploy/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: TypeScript build
        run: npm run build
      - name: Test suite
        run: npm test
      - name: Deterministic offline evaluation
        run: npm run evaluate
      - name: Build production container
        run: docker build --tag researchloop-ai:ci .
      - name: Validate Compose deployment configuration
        run: |
          cp .env.example .env
          APP_ACCESS_PASSWORD=ci-only-test-secret-with-more-than-16-chars docker compose config --quiet
